name: ♟ Chess Game

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  chess-move:
    runs-on: ubuntu-latest
    if: github.event.issue.number == 1 && !contains(github.event.comment.body, '/skip')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install chess

      - name: Extract move
        id: move
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.comment.body.trim();
            // Match UCI (e2e4), SAN (Nf3, O-O, O-O-O, e4, exd5), or keywords
            const uci = body.match(/\b([a-h][1-8][a-h][1-8][qrbn]?)\b/i);
            const san = body.match(/\b(O-O-O|O-O|[KQRBN][a-h]?[1-8]?x?[a-h][1-8]=?[QRBN]?[+#]?|[a-h]x?[a-h]?[1-8]=?[QRBN]?[+#]?)\b/);
            const reset = /reset|new game|restart/i.test(body);
            const move = reset ? 'reset' : (uci ? uci[1] : (san ? san[1] : ''));
            core.setOutput('move', move);
            core.setOutput('has_move', move !== '');

      - name: Apply move
        if: steps.move.outputs.has_move == 'true'
        run: |
          python chess.py \
            "${{ steps.move.outputs.move }}" \
            "${{ github.event.comment.user.login }}" \
            "${{ github.event.comment.html_url }}"

      - name: Commit
        if: steps.move.outputs.has_move == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "♟ ${{ github.event.comment.user.login }}: ${{ steps.move.outputs.move }}"
          file_pattern: "README.md .chess_state"

      - name: React to comment
        if: steps.move.outputs.has_move == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket'
            });
