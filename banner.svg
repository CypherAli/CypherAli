<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030014"/>
      <stop offset="30%" stop-color="#0a0025"/>
      <stop offset="60%" stop-color="#150040"/>
      <stop offset="100%" stop-color="#030014"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0"/>
      <stop offset="30%" stop-color="#A855F7" stop-opacity="1"/>
      <stop offset="70%" stop-color="#EC4899" stop-opacity="1"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glowPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="glowPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#DB2777"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E9D5FF"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FBCFE8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowBig">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Particle animation -->
    <circle id="particle" r="1.5" fill="#A855F7"/>
  </defs>

  <!-- Background -->
  <rect width="900" height="300" fill="url(#bgGrad)"/>

  <!-- Animated grid lines - horizontal -->
  <g opacity="0.06" stroke="#A855F7" stroke-width="0.5">
    <line x1="0" y1="50" x2="900" y2="50"/>
    <line x1="0" y1="100" x2="900" y2="100"/>
    <line x1="0" y1="150" x2="900" y2="150"/>
    <line x1="0" y1="200" x2="900" y2="200"/>
    <line x1="0" y1="250" x2="900" y2="250"/>
  </g>
  <!-- Animated grid lines - vertical -->
  <g opacity="0.04" stroke="#A855F7" stroke-width="0.5">
    <line x1="100" y1="0" x2="100" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="300"/>
    <line x1="300" y1="0" x2="300" y2="300"/>
    <line x1="400" y1="0" x2="400" y2="300"/>
    <line x1="500" y1="0" x2="500" y2="300"/>
    <line x1="600" y1="0" x2="600" y2="300"/>
    <line x1="700" y1="0" x2="700" y2="300"/>
    <line x1="800" y1="0" x2="800" y2="300"/>
  </g>

  <!-- Animated scanning line -->
  <rect x="0" y="0" width="900" height="2" fill="url(#lineGrad)" opacity="0.6">
    <animateTransform attributeName="transform" type="translate" values="0,0;0,300;0,0" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- Floating particles left -->
  <circle cx="80" cy="60" r="2" fill="#A855F7" opacity="0.5">
    <animate attributeName="cy" values="60;40;60" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="200" r="1.5" fill="#EC4899" opacity="0.4">
    <animate attributeName="cy" values="200;180;200" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="60" cy="140" r="1" fill="#A855F7" opacity="0.3">
    <animate attributeName="cy" values="140;125;140" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="80" r="1.8" fill="#7C3AED" opacity="0.4">
    <animate attributeName="cy" values="80;65;80" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.7;0.4" dur="4.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Floating particles right -->
  <circle cx="820" cy="70" r="2" fill="#EC4899" opacity="0.5">
    <animate attributeName="cy" values="70;50;70" dur="3.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="3.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="750" cy="220" r="1.5" fill="#A855F7" opacity="0.4">
    <animate attributeName="cy" values="220;200;220" dur="4.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="840" cy="170" r="1" fill="#EC4899" opacity="0.3">
    <animate attributeName="cy" values="170;155;170" dur="5.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="90" r="1.8" fill="#DB2777" opacity="0.4">
    <animate attributeName="cy" values="90;75;90" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- Orbiting ring left -->
  <ellipse cx="130" cy="150" rx="70" ry="25" fill="none" stroke="#A855F7" stroke-width="0.8" opacity="0.15" stroke-dasharray="4,8">
    <animateTransform attributeName="transform" type="rotate" from="0 130 150" to="360 130 150" dur="20s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="130" cy="150" rx="50" ry="18" fill="none" stroke="#7C3AED" stroke-width="0.5" opacity="0.1" stroke-dasharray="3,6">
    <animateTransform attributeName="transform" type="rotate" from="360 130 150" to="0 130 150" dur="15s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Orbiting ring right -->
  <ellipse cx="770" cy="150" rx="70" ry="25" fill="none" stroke="#EC4899" stroke-width="0.8" opacity="0.15" stroke-dasharray="4,8">
    <animateTransform attributeName="transform" type="rotate" from="0 770 150" to="360 770 150" dur="18s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="770" cy="150" rx="50" ry="18" fill="none" stroke="#DB2777" stroke-width="0.5" opacity="0.1" stroke-dasharray="3,6">
    <animateTransform attributeName="transform" type="rotate" from="360 770 150" to="0 770 150" dur="14s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Central glow -->
  <circle cx="450" cy="130" r="120" fill="#A855F7" opacity="0.03">
    <animate attributeName="r" values="120;130;120" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="130" r="80" fill="#EC4899" opacity="0.03">
    <animate attributeName="r" values="80;90;80" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Hexagon decorations left -->
  <g transform="translate(100, 70)" opacity="0.15">
    <polygon points="15,0 30,8 30,24 15,32 0,24 0,8" fill="none" stroke="#A855F7" stroke-width="1">
      <animate attributeName="opacity" values="0.15;0.4;0.15" dur="3s" repeatCount="indefinite"/>
    </polygon>
  </g>
  <g transform="translate(50, 200)" opacity="0.1">
    <polygon points="10,0 20,5 20,16 10,21 0,16 0,5" fill="none" stroke="#7C3AED" stroke-width="0.8">
      <animate attributeName="opacity" values="0.1;0.3;0.1" dur="4s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- Hexagon decorations right -->
  <g transform="translate(790, 50)" opacity="0.15">
    <polygon points="12,0 24,7 24,19 12,26 0,19 0,7" fill="none" stroke="#EC4899" stroke-width="1">
      <animate attributeName="opacity" values="0.15;0.4;0.15" dur="3.5s" repeatCount="indefinite"/>
    </polygon>
  </g>
  <g transform="translate(830, 220)" opacity="0.1">
    <polygon points="10,0 20,5 20,16 10,21 0,16 0,5" fill="none" stroke="#DB2777" stroke-width="0.8">
      <animate attributeName="opacity" values="0.1;0.3;0.1" dur="4.5s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- Data stream lines - animated dashes -->
  <line x1="0" y1="30" x2="250" y2="30" stroke="#A855F7" stroke-width="0.8" stroke-dasharray="2,6,8,6" opacity="0.2">
    <animate attributeName="stroke-dashoffset" from="0" to="-40" dur="2s" repeatCount="indefinite"/>
  </line>
  <line x1="650" y1="270" x2="900" y2="270" stroke="#EC4899" stroke-width="0.8" stroke-dasharray="2,6,8,6" opacity="0.2">
    <animate attributeName="stroke-dashoffset" from="0" to="40" dur="2s" repeatCount="indefinite"/>
  </line>
  <line x1="0" y1="270" x2="200" y2="270" stroke="#7C3AED" stroke-width="0.5" stroke-dasharray="1,4,6,4" opacity="0.15">
    <animate attributeName="stroke-dashoffset" from="0" to="-30" dur="3s" repeatCount="indefinite"/>
  </line>
  <line x1="700" y1="30" x2="900" y2="30" stroke="#DB2777" stroke-width="0.5" stroke-dasharray="1,4,6,4" opacity="0.15">
    <animate attributeName="stroke-dashoffset" from="0" to="30" dur="3s" repeatCount="indefinite"/>
  </line>

  <!-- Corner brackets -->
  <g stroke="#A855F7" stroke-width="1.5" opacity="0.5" fill="none">
    <polyline points="20,35 20,15 40,15"/>
    <polyline points="860,15 880,15 880,35"/>
    <polyline points="880,265 880,285 860,285"/>
    <polyline points="40,285 20,285 20,265"/>
  </g>

  <!-- Top border line -->
  <rect x="0" y="0" width="900" height="2" fill="url(#lineGrad)" opacity="0.8"/>

  <!-- Pulsing divider lines -->
  <rect x="120" y="130" width="200" height="1" fill="url(#lineGrad)" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.7;0.4" dur="2s" repeatCount="indefinite"/>
  </rect>
  <rect x="580" y="130" width="200" height="1" fill="url(#lineGrad)" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.7;0.4" dur="2s" repeatCount="indefinite"/>
  </rect>

  <!-- Main name with glow -->
  <text x="450" y="120" font-family="'Courier New', Courier, monospace" font-size="56" font-weight="bold"
        fill="url(#textGrad)" text-anchor="middle" letter-spacing="8" filter="url(#glow)">TRỊNH HOÀNG</text>

  <!-- Alias / handle -->
  <text x="450" y="155" font-family="'Courier New', Courier, monospace" font-size="14"
        fill="#A855F7" text-anchor="middle" letter-spacing="6" filter="url(#glow)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
    ▸ CYPHERALI · ALICIA ◂
  </text>

  <!-- Subtitle with typing effect feel -->
  <text x="450" y="188" font-family="'Courier New', Courier, monospace" font-size="11"
        fill="#9ca3af" text-anchor="middle" letter-spacing="3">SOFTWARE ENGINEER · WEB3 ARCHITECT · SYSTEM OPTIMIZER</text>

  <!-- Status indicator -->
  <g transform="translate(370, 210)">
    <circle cx="0" cy="0" r="4" fill="#10B981" opacity="0.8">
      <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="3" fill="#10B981"/>
    <text x="12" y="4" font-family="'Courier New', Courier, monospace" font-size="10" fill="#10B981" letter-spacing="2">BUILDING THE FUTURE</text>
  </g>

  <!-- Binary decoration -->
  <text x="30" y="295" font-family="'Courier New', monospace" font-size="7" fill="#A855F7" opacity="0.15" letter-spacing="1">
    01001000 01001111 01000001 01001110 01000111
  </text>
  <text x="620" y="295" font-family="'Courier New', monospace" font-size="7" fill="#EC4899" opacity="0.15" letter-spacing="1">
    01000011 01011001 01010000 01001000 01000101 01010010
  </text>

  <!-- Bottom border line -->
  <rect x="0" y="298" width="900" height="2" fill="url(#lineGrad)" opacity="0.8"/>
</svg>
